name: Build and publish latest Docker image
on:
  # Trigger the workflow on push or pull request,
  # for the develop branch and all new tags
  push:
    tags:
      - v*
      - preview-*
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, we do cancel in-progress runs as we want to get the latest production deployments.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: get env variables for GIT related info
        run: |
          echo "BUILD_DATE=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
          echo "GIT_LAST_COMMIT_DATE=$(git log -1 --format=%cd --date=format:%Y%m%d)" >> $GITHUB_ENV
          echo "GIT_BRANCH=$(echo ${GITHUB_REF} | sed 's/refs\/heads\///')" >> $GITHUB_ENV
          echo "GIT_COMMIT_SHA=$(git rev-parse --short ${GITHUB_SHA})" >> $GITHUB_ENV
          echo "GIT_REMOTE=$(git config --get remote.origin.url)" >> $GITHUB_ENV
          echo "GIT_TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: 'c2dhunilu/gilbert-trausch:${{env.GIT_TAG}}'
          build-args: |
            GIT_TAG=${{env.GIT_TAG}}
            GIT_BRANCH=${{env.GIT_BRANCH}}
            GIT_COMMIT_SHA=${{env.GIT_COMMIT_SHA}}
            BUILD_DATE=${{env.BUILD_DATE}}
            GIT_LAST_COMMIT_DATE=${{env.GIT_LAST_COMMIT_DATE}}
